name: gameplay

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: gameplay
      POSTGRES_PASSWORD: gameplay
      POSTGRES_DB: gameplay
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gameplay -d gameplay']
      interval: 5s
      timeout: 3s
      retries: 10

  # Production build of the API, next to `npm run dev` on the host (port 3333).
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3333
      LOG_LEVEL: info
      DATABASE_URL: postgresql://gameplay:gameplay@postgres:5432/gameplay
      # Local only; production gets its own secret.
      BETTER_AUTH_SECRET: local-docker-secret-local-docker-secret
      BETTER_AUTH_URL: http://localhost:3334
    ports:
      - '3334:3333'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
