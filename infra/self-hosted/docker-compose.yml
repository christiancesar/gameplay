# Self-hosting stack: Gameplay on your own PC, shared through a Cloudflare Tunnel.
# Use ./start.sh (it creates .env and, in quick mode, discovers the public URL).
#
#   browser -> Cloudflare -> cloudflared -> web (nginx) -> api -> postgres
#
# Migrations run from the repository on this machine (start.sh), against the
# database port bound to loopback: no image carries the Prisma CLI.
#
# Also the database of local development: `npm run host:db` starts only Postgres
# (with the gameplay_test database for the api e2e tests).
#
# Variable names follow infra/production; storage and database stay local.
name: gameplay-host

# Same rotation as production: Docker keeps logs forever by default.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

x-api-env: &api-env
  NODE_ENV: production
  PORT: 3333
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://gameplay:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/gameplay
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set in .env}
  REGISTRATION_KEY_SECRET: ${REGISTRATION_KEY_SECRET:?set in .env}
  BETTER_AUTH_URL: ${APP_URL:-http://localhost:8080}
  WEB_ORIGIN: ${APP_URL:-http://localhost:8080}
  # Public API docs at /api/docs (REST, auth and Socket.IO events).
  DOCS_ENABLED: ${DOCS_ENABLED:-true}
  STORAGE_DRIVER: local
  STORAGE_LOCAL_DIR: /data/uploads
  PUBLIC_UPLOADS_URL: /uploads
  # Chain is cloudflared -> nginx -> api. nginx overwrites X-Forwarded-For with
  # CF-Connecting-IP (the real client), so the api trusts exactly one hop.
  TRUST_PROXY_HOPS: 1
  ICE_PROVIDER: ${ICE_PROVIDER:-cloudflare}
  CLOUDFLARE_TURN_KEY_ID: ${CLOUDFLARE_TURN_KEY_ID:-}
  CLOUDFLARE_TURN_API_TOKEN: ${CLOUDFLARE_TURN_API_TOKEN:-}
  CLOUDFLARE_SFU_APP_ID: ${CLOUDFLARE_SFU_APP_ID:-}
  CLOUDFLARE_SFU_APP_TOKEN: ${CLOUDFLARE_SFU_APP_TOKEN:-}
  CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
  CLOUDFLARE_ANALYTICS_TOKEN: ${CLOUDFLARE_ANALYTICS_TOKEN:-}
  OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-gameplay-api}
  OTEL_DEPLOYMENT_ENVIRONMENT: ${OTEL_DEPLOYMENT_ENVIRONMENT:-host}

services:
  postgres:
    # Same major version as production (Prisma Postgres runs 17).
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: gameplay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: gameplay
    # Loopback only, for the migrations start.sh runs from the repository.
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - postgres-data-17:/var/lib/postgresql/data
      # Creates gameplay_test on a fresh volume; lib.sh creates it on older ones.
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gameplay -d gameplay']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: gameplay-host-api
    restart: unless-stopped
    logging: *logging
    environment: *api-env
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        # Same-origin path nginx forwards to Sentry (see nginx.conf).
        VITE_SENTRY_TUNNEL: /monitoring/sentry
        # Faro on only with a collector; the browser talks to the nginx tunnel.
        VITE_FARO_URL: ${FARO_COLLECTOR_URL:+/monitoring/faro}
        VITE_SENTRY_ENVIRONMENT: ${OTEL_DEPLOYMENT_ENVIRONMENT:-host}
        # start.sh exports the git commit; Sentry groups errors by it.
        VITE_SENTRY_RELEASE: ${GAMEPLAY_RELEASE:-}
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-}
      # Uploads the source maps; a secret, so it never lands in an image layer.
      secrets:
        - sentry_auth_token
    image: gameplay-host-web
    restart: unless-stopped
    logging: *logging
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:80'
    environment:
      NGINX_ENVSUBST_FILTER: '^GAMEPLAY_'
      GAMEPLAY_SENTRY_ENVELOPE_URL: ${SENTRY_ENVELOPE_URL:-}
      GAMEPLAY_FARO_COLLECTOR_URL: ${FARO_COLLECTOR_URL:-}
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - uploads:/data/uploads:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/api/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      api:
        condition: service_healthy

  # Quick tunnel: no account, random https://*.trycloudflare.com URL on every start.
  # The metrics endpoint (loopback only) tells start.sh which URL was assigned.
  cloudflared-quick:
    profiles: [quick]
    image: cloudflare/cloudflared:2026.10.3
    restart: unless-stopped
    logging: *logging
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://web:80
    ports:
      - '127.0.0.1:${CLOUDFLARED_METRICS_PORT:-20241}:2000'

  # Named tunnel with a credentials file (cloudflared tunnel create): fixed
  # hostname, routed to this tunnel in DNS beforehand. The ingress rules come
  # from the `cloudflared-config` config below (no secrets in it).
  cloudflared-named:
    profiles: [named]
    image: cloudflare/cloudflared:2026.10.3
    restart: unless-stopped
    logging: *logging
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    # The credentials file is usually readable only by its owner: run as that user.
    user: ${CLOUDFLARED_UID:-1000}
    configs:
      - source: cloudflared-config
        target: /etc/cloudflared/config.yml
    volumes:
      - ${CLOUDFLARE_TUNNEL_CREDENTIALS:-/dev/null}:/etc/cloudflared/credentials.json:ro

  # Named tunnel with a token (created in the Cloudflare dashboard): the hostname
  # is configured there to point at http://web:80.
  cloudflared-token:
    profiles: [token]
    image: cloudflare/cloudflared:2026.10.3
    restart: unless-stopped
    logging: *logging
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}

configs:
  cloudflared-config:
    content: |
      tunnel: ${CLOUDFLARE_TUNNEL_ID:-unset}
      credentials-file: /etc/cloudflared/credentials.json
      ingress:
        - hostname: ${PUBLIC_HOSTNAME:-unset.invalid}
          service: http://web:80
        - service: http_status:404

secrets:
  sentry_auth_token:
    environment: SENTRY_AUTH_TOKEN

volumes:
  # Postgres 17 data. The Postgres 18 volume (postgres-data) was left on disk
  # untouched after its dump was restored here.
  postgres-data-17:
  uploads:
