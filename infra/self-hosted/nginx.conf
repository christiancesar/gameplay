# Mounted as an nginx template: on start the image writes it to
# /etc/nginx/conf.d/default.conf, filling in ${GAMEPLAY_*} variables only
# (NGINX_ENVSUBST_FILTER), so nginx's own $variables are left alone.
# Chain: browser -> Cloudflare -> cloudflared -> this nginx -> api.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Real client IP: Cloudflare puts it in CF-Connecting-IP. Without that header
# (direct access on the host port) fall back to the socket address. The api
# trusts exactly one hop (this nginx), so X-Forwarded-For is overwritten below,
# never appended to what a client sent.
map $http_cf_connecting_ip $client_ip {
  default $http_cf_connecting_ip;
  ''      $remote_addr;
}

server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Images are at most 2 MB; leave room for multipart overhead.
  client_max_body_size 4m;

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /api/ {
    proxy_pass http://api:3333;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Real-IP $client_ip;
    # cloudflared talks plain HTTP to nginx; the browser sees https.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location /socket.io/ {
    proxy_pass http://api:3333;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;
  }

  # Sentry tunnel: ad blockers drop requests to sentry.io, not to this site.
  # Forwards only to this app's Sentry project (start.sh derives the URL from
  # the DSN); 404 while Sentry is off. Resolved at request time, so a missing
  # or unreachable Sentry never stops nginx from starting.
  location = /monitoring/sentry {
    set $sentry_envelope "${GAMEPLAY_SENTRY_ENVELOPE_URL}";
    if ($sentry_envelope = "") {
      return 404;
    }
    limit_except POST {
      deny all;
    }
    resolver 127.0.0.11 valid=300s ipv6=off;
    proxy_pass $sentry_envelope;
    proxy_ssl_server_name on;
    proxy_set_header Cookie "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
  }

  # Faro tunnel, same idea: the browser posts to this site and nginx forwards
  # to the app's collector (FARO_COLLECTOR_URL). 404 while Faro is off.
  location = /monitoring/faro {
    set $faro_collector "${GAMEPLAY_FARO_COLLECTOR_URL}";
    if ($faro_collector = "") {
      return 404;
    }
    limit_except POST {
      deny all;
    }
    resolver 127.0.0.11 valid=300s ipv6=off;
    proxy_pass $faro_collector;
    proxy_ssl_server_name on;
    proxy_set_header Cookie "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
  }

  # Written by the api into a shared volume, mounted read-only here. Keys carry
  # a content hash, so a file never changes.
  location /uploads/ {
    alias /data/uploads/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # Vite emits hashed names under /assets.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
