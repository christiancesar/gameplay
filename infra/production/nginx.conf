# Production nginx: TLS from Cloudflare (origin certificate, Full strict) to the api.
# Chain: browser -> Cloudflare -> this nginx -> api. The web is on Workers and
# the uploads on S3, so only the api paths are served here.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Real client IP: Cloudflare puts it in CF-Connecting-IP, and the firewall only
# lets Cloudflare reach port 443, so the header is trusted. Without it (a local
# check on the server) fall back to the socket address. The api trusts exactly
# one hop, so X-Forwarded-For is overwritten below, never appended to.
map $http_cf_connecting_ip $client_ip {
  default $http_cf_connecting_ip;
  ''      $remote_addr;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;
  server_tokens off;

  ssl_certificate     /etc/nginx/certs/origin.pem;
  ssl_certificate_key /etc/nginx/certs/origin.key;
  ssl_protocols       TLSv1.2 TLSv1.3;

  # Images are at most 2 MB; leave room for multipart overhead.
  client_max_body_size 4m;

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /api/ {
    proxy_pass http://api:3333;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /socket.io/ {
    proxy_pass http://api:3333;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;
  }

  location / {
    return 404;
  }
}
