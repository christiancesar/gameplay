# Builds both desktop platforms before publishing one release. Run by hand from main.
# The next 0.0.{x} comes from the latest v0.0.* tag; the tag is created only after both builds pass.
# See apps/desktop/README.md.
name: Desktop release

on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::The desktop release runs from main, not from ${GITHUB_REF_NAME}."
          exit 1

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run repo:typecheck
      - run: npm run repo:lint
      - run: npm run repo:format-check
      - name: Tests of the desktop and what it shares
        run: npx turbo run test --filter=desktop --filter=@gameplay/client --filter=@gameplay/desktop-bridge --filter=@gameplay/contracts

  version:
    needs: checks
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Next version
        id: next
        run: |
          last=$(git tag --list 'v0.0.*' --sort=-v:refname | head -n 1)
          next=$(( ${last##*.} + 1 ))
          echo "Last release: ${last:-none}. This one: 0.0.${next}"
          echo "version=0.0.${next}" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    runs-on: ubuntu-24.04
    environment: electron-production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # The deb maker needs them.
      - name: Packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg fakeroot

      - run: npm ci
      - run: npm run contracts:build
      - name: Use the release version
        run: npm pkg set version="${{ needs.version.outputs.version }}" -w desktop

      - name: Make the Linux DEB, AppImage and ZIP
        run: npm run desktop:make
        env:
          VITE_APP_ENV: production
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - uses: actions/upload-artifact@v6
        with:
          name: desktop-linux
          path: |
            apps/desktop/out/make/deb/x64/*.deb
            apps/desktop/out/make/*.AppImage
            apps/desktop/out/make/zip/linux/x64/*.zip
          if-no-files-found: error
          compression-level: 0

  windows:
    needs: version
    runs-on: windows-latest
    environment: electron-production
    timeout-minutes: 45
    steps:
      # Keep build.sh in LF format for Git Bash on the Windows runner.
      - name: Keep Unix line endings
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Put MinGW compiler on PATH
        run: '"${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'

      - run: npm ci
      # Turbo builds workspace dependencies, including @gameplay/contracts/dist, first.
      - run: npx turbo run typecheck --filter=desktop
      - run: npx turbo run test --filter=desktop
      - name: Use the release version
        run: npm pkg set version="${{ needs.version.outputs.version }}" -w desktop

      - name: Make the Windows installer and ZIP
        run: npm run desktop:make
        env:
          MINGW_CXX: g++
          VITE_APP_ENV: production
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Validate Squirrel artifacts
        shell: bash
        run: |
          feed="apps/desktop/out/make/squirrel.windows/x64"
          test -f "$feed/RELEASES"
          compgen -G "$feed/*Setup.exe" >/dev/null
          compgen -G "$feed/*.nupkg" >/dev/null
          test -s "$feed/RELEASES"

      - uses: actions/upload-artifact@v6
        with:
          name: desktop-windows
          path: |
            apps/desktop/out/make/squirrel.windows/x64/*.exe
            apps/desktop/out/make/squirrel.windows/x64/*.nupkg
            apps/desktop/out/make/squirrel.windows/x64/RELEASES
            apps/desktop/out/make/zip/win32/x64/*.zip
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [version, linux, windows]
    runs-on: ubuntu-24.04
    environment: electron-production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Configure AWS credentials for update publishing
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Validate Squirrel feed integrity
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          test -n "$RELEASE_VERSION"
          feed="$(find release-assets -type f -name RELEASES -print -quit)"
          test -n "$feed"
          test -s "$feed"
          while read -r hash name size; do
            test -n "$hash" && test -n "$name" && test -n "$size"
            file="$(find release-assets -type f -name "$name" -print -quit)"
            test -n "$file"
            actual_hash="$(sha1sum "$file" | awk '{print tolower($1)}')"
            actual_size="$(stat -c '%s' "$file")"
            test "$actual_hash" = "$(printf '%s' "$hash" | tr '[:upper:]' '[:lower:]')"
            test "$actual_size" = "$size"
          done < "$feed"
          echo "Validated Squirrel feed for ${RELEASE_VERSION}"

      - name: Prepare public download artifacts and manifest
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          PUBLIC_ORIGIN: ${{ vars.VITE_SERVER_URL }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_VERSION"
          test -n "$PUBLIC_ORIGIN"
          catalog="$RUNNER_TEMP/gameplay-downloads"
          mkdir -p "$catalog"
          setup="$(find release-assets -type f -name '*Setup.exe' -print -quit)"
          deb="$(find release-assets -type f -name '*.deb' -print -quit)"
          appimage="$(find release-assets -type f -name '*.AppImage' -print -quit)"
          test -n "$setup" && test -s "$setup"
          test -n "$deb" && test -s "$deb"
          test -n "$appimage" && test -s "$appimage"
          cp "$setup" "$catalog/Gameplay-Setup.exe"
          cp "$deb" "$catalog/gameplay.deb"
          cp "$appimage" "$catalog/Gameplay.AppImage"
          chmod +x "$catalog/Gameplay.AppImage"
          sha256() { sha256sum "$1" | awk '{print $1}'; }
          size() { stat -c '%s' "$1"; }
          origin="${PUBLIC_ORIGIN%/}"
          jq -n \
            --arg version "$RELEASE_VERSION" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg windowsUrl "$origin/api/downloads/stable/Gameplay-Setup.exe" \
            --arg debUrl "$origin/api/downloads/stable/gameplay.deb" \
            --arg appImageUrl "$origin/api/downloads/stable/Gameplay.AppImage" \
            --arg windowsSha256 "$(sha256 "$catalog/Gameplay-Setup.exe")" \
            --arg debSha256 "$(sha256 "$catalog/gameplay.deb")" \
            --arg appImageSha256 "$(sha256 "$catalog/Gameplay.AppImage")" \
            --argjson windowsSize "$(size "$catalog/Gameplay-Setup.exe")" \
            --argjson debSize "$(size "$catalog/gameplay.deb")" \
            --argjson appImageSize "$(size "$catalog/Gameplay.AppImage")" \
            '{version: $version, publishedAt: $publishedAt, downloads: {
              windows: {architecture: "x64", format: "squirrel-installer", url: $windowsUrl, size: $windowsSize, sha256: $windowsSha256},
              linuxDeb: {architecture: "x64", format: "deb", url: $debUrl, size: $debSize, sha256: $debSha256},
              linuxAppImage: {architecture: "x64", format: "appimage", url: $appImageUrl, size: $appImageSize, sha256: $appImageSha256}
            }}' > "$catalog/latest.json"
          jq -e --arg version "$RELEASE_VERSION" '.version == $version and (.downloads | length) == 3' "$catalog/latest.json"

      - name: Publish immutable Windows release to S3
        shell: bash
        env:
          UPDATE_BUCKET: ${{ vars.WINDOWS_UPDATE_BUCKET }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          test -n "$UPDATE_BUCKET"
          prefix="updates/windows/releases/${RELEASE_VERSION}"
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            if [ "$name" = "RELEASES" ]; then
              cache_control="no-store, max-age=0"
              content_type="text/plain"
            else
              cache_control="public, max-age=31536000, immutable"
              content_type="application/octet-stream"
            fi
            aws s3 cp "$file" "s3://${UPDATE_BUCKET}/${prefix}/${name}" \
              --cache-control "$cache_control" \
              --content-type "$content_type"
          done < <(find release-assets -type f \( -name 'RELEASES' -o -name '*.nupkg' -o -name '*.exe' \) -print0)

      - name: Publish immutable public desktop downloads to S3
        shell: bash
        env:
          UPDATE_BUCKET: ${{ vars.WINDOWS_UPDATE_BUCKET }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$UPDATE_BUCKET"
          catalog="$RUNNER_TEMP/gameplay-downloads"
          prefix="downloads/releases/${RELEASE_VERSION}"
          for file in "$catalog/Gameplay-Setup.exe" "$catalog/gameplay.deb" "$catalog/Gameplay.AppImage" "$catalog/latest.json"; do
            name="$(basename "$file")"
            if [ "$name" = "latest.json" ]; then
              cache_control="no-store, max-age=0"
              content_type="application/json"
            elif [ "$name" = "gameplay.deb" ]; then
              cache_control="public, max-age=31536000, immutable"
              content_type="application/vnd.debian.binary-package"
            elif [ "$name" = "Gameplay.AppImage" ]; then
              cache_control="public, max-age=31536000, immutable"
              content_type="application/vnd.appimage"
            else
              cache_control="public, max-age=31536000, immutable"
              content_type="application/vnd.microsoft.portable-executable"
            fi
            aws s3 cp "$file" "s3://${UPDATE_BUCKET}/${prefix}/${name}" \
              --cache-control "$cache_control" \
              --content-type "$content_type"
          done

      - name: Promote public desktop downloads to stable
        shell: bash
        env:
          UPDATE_BUCKET: ${{ vars.WINDOWS_UPDATE_BUCKET }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$UPDATE_BUCKET"
          catalog="$RUNNER_TEMP/gameplay-downloads"
          source_prefix="s3://${UPDATE_BUCKET}/downloads/releases/${RELEASE_VERSION}"
          stable_prefix="s3://${UPDATE_BUCKET}/downloads/stable"
          for name in Gameplay-Setup.exe gameplay.deb Gameplay.AppImage; do
            if [ "$name" = "gameplay.deb" ]; then
              content_type="application/vnd.debian.binary-package"
            elif [ "$name" = "Gameplay.AppImage" ]; then
              content_type="application/vnd.appimage"
            else
              content_type="application/vnd.microsoft.portable-executable"
            fi
            aws s3 cp "${source_prefix}/${name}" "${stable_prefix}/${name}" \
              --cache-control "public, max-age=31536000, immutable" \
              --content-type "$content_type"
          done
          aws s3 cp "${source_prefix}/latest.json" "${stable_prefix}/latest.json" \
            --cache-control "no-store, max-age=0" \
            --content-type "application/json"

      - name: Promote validated Windows release to stable
        shell: bash
        env:
          UPDATE_BUCKET: ${{ vars.WINDOWS_UPDATE_BUCKET }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          test -n "$UPDATE_BUCKET"
          source_prefix="s3://${UPDATE_BUCKET}/updates/windows/releases/${RELEASE_VERSION}"
          stable_prefix="s3://${UPDATE_BUCKET}/updates/windows/stable"
          history_prefix="s3://${UPDATE_BUCKET}/updates/windows/promotions/${RELEASE_VERSION}"
          aws s3 cp "${stable_prefix}/RELEASES" "${history_prefix}/previous-RELEASES" \
            --cache-control "public, max-age=31536000, immutable" || true
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            [ "$name" = "RELEASES" ] && continue
            aws s3 cp "${source_prefix}/${name}" "${stable_prefix}/${name}" \
              --cache-control "public, max-age=31536000, immutable" \
              --content-type "application/octet-stream"
          done < <(find release-assets -type f \( -name '*.nupkg' -o -name '*.exe' \) -print0)
          aws s3 cp "${source_prefix}/RELEASES" "${stable_prefix}/RELEASES" \
            --cache-control "no-store, max-age=0" \
            --content-type "text/plain"

      - name: Publish the complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.zip' -o -name '*.exe' -o -name '*.nupkg' -o -name 'RELEASES' \) -print0)
          if ! find release-assets -type f -name 'RELEASES' -print -quit | grep -q .; then
            echo "::error::The Squirrel RELEASES file was not published."
            exit 1
          fi
          if ! find release-assets -type f -name '*.nupkg' -print -quit | grep -q .; then
            echo "::error::No Squirrel nupkg was published."
            exit 1
          fi
          gh release create "v${VERSION}" "${assets[@]}" --target "$GITHUB_SHA" --title "v${VERSION}" --generate-notes
